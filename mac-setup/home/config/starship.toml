# Starship Prompt — Personal Workspace Dashboard

format = """
$os$directory$git_branch$git_status$nodejs$python$golang$rust$bun$package$cmd_duration
$character"""

add_newline = true

[os]
disabled = false
style = "white"
format = "[$symbol]($style) "

[os.symbols]
Macos = " "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "󰊢 "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status]($style)) "

[nodejs]
symbol = "󰎙 "
style = "green"
format = "via [$symbol$version]($style) "
detect_files = ["package.json", ".nvmrc", "pnpm-lock.yaml"]
detect_folders = ["node_modules"]

[python]
symbol = "󰌠 "
style = "yellow"
format = "via [$symbol$version]($style) "
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version", "Pipfile"]
detect_folders = ["__pycache__", ".venv"]

[golang]
symbol = "󰟓 "
style = "blue"
format = "via [$symbol$version]($style) "
detect_files = ["go.mod", "go.sum"]
detect_folders = ["cmd", "pkg"]

[rust]
symbol = "󱘗 "
style = "red"
format = "via [$symbol$version]($style) "
detect_files = ["Cargo.toml"]
detect_folders = ["src"]

[bun]
symbol = "󰁣 "
style = "white"
format = "via [$symbol$version]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
detect_files = ["docker-compose.yml", "Dockerfile", ".dockerignore"]

[package]
symbol = "󰏗 "
style = "bold white"
format = "via [$symbol$version]($style) "
display_private = true

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "gray"
format = "[$duration]($style) "

[character]
success_symbol = "❯"
error_symbol = "❯"
vicmd_symbol = "❮"